; WitchTime 1.0 settings. Changes apply within a second while the game runs.
; With Mod Settings Menu installed, the same settings are under Options > MODS, and a value
; changed there wins over this file.

[General]
; 0 = the mod does nothing: a perfect dodge's slow motion is the game's.
Enabled=1
; 1 = show a message at start when a game update, or another mod, stops the mod from working.
VersionWarning=1

[WitchTime]
; A perfect dodge slows time for a moment (0.6 s in the game, Dylan included). That moment plays as
; in the game, then the world stays slow while Dylan moves at normal speed.
; Duration: seconds in all, the game's moment included (1 to 20).
Duration=4
; The world's speed for the rest of it, in percent (2 to 100).
WorldSpeed=20
; Dylan's speed, in percent (25 to 300).
PlayerSpeed=100
